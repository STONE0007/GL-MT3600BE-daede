name: Build GL-MT3600BE daede

on:
  workflow_dispatch:
  schedule:
    # 每天早上 08:00 (UTC 00:00) 自动巡检一次上游更新
    - cron: '0 0 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_upstream.outputs.should_build }}
      upstream_commit: ${{ steps.check_upstream.outputs.upstream_commit }}
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 探测上游 kenzok8/openwrt-daede 最新 Commit
        id: check_upstream
        run: |
          UPSTREAM_COMMIT=$(git ls-remote https://github.com/kenzok8/openwrt-daede.git HEAD | awk '{print $1}')
          echo "上游最新 Commit: $UPSTREAM_COMMIT"

          LOCAL_COMMIT=""
          if [ -f "daede.hash" ]; then
            LOCAL_COMMIT=$(cat daede.hash | tr -d '[:space:]')
          fi
          echo "本地上次 Commit: $LOCAL_COMMIT"

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$UPSTREAM_COMMIT" = "$LOCAL_COMMIT" ]; then
            echo "上游未更新，跳过编译。"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "检测到新版本（或手动触发），准备编译！"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 清理 Runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get -y purge azure-cli ghc* zulu* firefox google-chrome* dotnet* powershell openjdk*
          sudo apt-get autoremove --purge -y
          sudo apt-get clean

      - name: 安装 OpenWrt 与 eBPF 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz genisoimage msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev clang llvm lld bpfcc-tools libbpf-dev dwarves
          sudo ln -sf /usr/bin/clang /clang
          sudo ln -sf /usr/bin/llvm-dis /llvm-dis

      - name: 拉取源码与配置 Feeds
        run: |
          git clone --depth 1 https://github.com/KaguyaRing/openwrt-custom-gl-mt3600be.git openwrt
          cd openwrt
          
          # 剔除旧版 daed_repo，注入全新独立包与 Aurora 主题主分支
          sed -i '/daed_repo/d' feeds.conf.default 2>/dev/null || true
          git clone --depth 1 https://github.com/kenzok8/openwrt-daede.git package/openwrt-daede
          rm -rf package/luci-theme-aurora package/luci-app-aurora-config
          git clone --depth 1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          git clone --depth 1 https://github.com/eamonxg/luci-app-aurora-config.git package/luci-app-aurora-config

          # 源头拦截：彻底清除底包内预置的 OpenClash 与 AdGuardHome 源码目录
          rm -rf package/*openclash* feeds/*/*openclash* package/*adguardhome* feeds/*/*adguardhome* 2>/dev/null || true
          sed -i '/openclash/d' feeds.conf.default 2>/dev/null || true
          
          # 卸载冲突包并更新安装 Feeds
          ./scripts/feeds uninstall luci-app-daede daed dae adguardhome luci-app-adguardhome 2>/dev/null || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

          # 强制补齐 LuCI 兼容运行时支撑
          ./scripts/feeds install -p luci -f luci-compat luci-lua-runtime

          # 替换 Go 编译器为 1.26+ 分支
          rm -rf feeds/packages/lang/golang
          git clone --depth 1 https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang
          ./scripts/feeds install -f -p packages golang

      - name: 注入满血 eBPF、内核原生 BTF 与事件追踪调优
        run: |
          cd openwrt
          KCONFIGS=$(ls target/linux/mediatek/filogic/config-* 2>/dev/null)
          for KCONFIG in $KCONFIGS; do
            # 1. 切换抢占模型为低延迟桌面级（Preemptible Kernel）
            sed -i 's/CONFIG_PREEMPT_NONE=y/# CONFIG_PREEMPT_NONE is not set/g' "$KCONFIG"
            sed -i 's/CONFIG_PREEMPT_VOLUNTARY=y/# CONFIG_PREEMPT_VOLUNTARY is not set/g' "$KCONFIG"
            grep -qF "CONFIG_PREEMPT=y" "$KCONFIG" || echo "CONFIG_PREEMPT=y" >> "$KCONFIG"
            grep -qF "CONFIG_PREEMPTION=y" "$KCONFIG" || echo "CONFIG_PREEMPTION=y" >> "$KCONFIG"

            # 2. 锁定 BBR 为默认 TCP 拥塞控制算法
            sed -i 's/CONFIG_DEFAULT_CUBIC=y/# CONFIG_DEFAULT_CUBIC is not set/g' "$KCONFIG"
            sed -i 's/CONFIG_DEFAULT_TCP_CONG="cubic"/CONFIG_DEFAULT_TCP_CONG="bbr"/g' "$KCONFIG"
            for cfg in "CONFIG_TCP_CONG_ADVANCED=y" "CONFIG_TCP_CONG_BBR=y" "CONFIG_DEFAULT_BBR=y" 'CONFIG_DEFAULT_TCP_CONG="bbr"'; do
              sed -i "s/# ${cfg} is not set//g" "$KCONFIG"
              grep -qF "${cfg}" "$KCONFIG" || echo "${cfg}" >> "$KCONFIG"
            done

            # 3. 锁定 FQ 为默认队列调度器
            sed -i 's/CONFIG_DEFAULT_FQ_CODEL=y/# CONFIG_DEFAULT_FQ_CODEL is not set/g' "$KCONFIG"
            sed -i 's/CONFIG_DEFAULT_PFIFO_FAST=y/# CONFIG_DEFAULT_PFIFO_FAST is not set/g' "$KCONFIG"
            sed -i 's/CONFIG_DEFAULT_NET_SCH="fq_codel"/CONFIG_DEFAULT_NET_SCH="fq"/g' "$KCONFIG"
            sed -i 's/CONFIG_DEFAULT_NET_SCH="pfifo_fast"/CONFIG_DEFAULT_NET_SCH="fq"/g' "$KCONFIG"
            for cfg in "CONFIG_NET_SCH_FQ=y" "CONFIG_NET_SCH_DEFAULT=y" "CONFIG_DEFAULT_FQ=y" 'CONFIG_DEFAULT_NET_SCH="fq"'; do
              sed -i "s/# ${cfg} is not set//g" "$KCONFIG"
              grep -qF "${cfg}" "$KCONFIG" || echo "${cfg}" >> "$KCONFIG"
            done

            # 4. 强制开启内核原生 BTF 字典生成
            sed -i 's/CONFIG_DEBUG_INFO_REDUCED=y/# CONFIG_DEBUG_INFO_REDUCED is not set/g' "$KCONFIG"
            sed -i 's/CONFIG_DEBUG_INFO_SPLIT=y/# CONFIG_DEBUG_INFO_SPLIT is not set/g' "$KCONFIG"
            for cfg in "CONFIG_DEBUG_INFO" "CONFIG_DEBUG_INFO_BTF" "CONFIG_BPF_SYSCALL"; do
              sed -i "s/# ${cfg} is not set//g" "$KCONFIG"
              grep -qF "${cfg}=y" "$KCONFIG" || echo "${cfg}=y" >> "$KCONFIG"
            done

            # 5. 注入 BPF 事件追踪与探针（消除 bpf_get_current_task 警告）
            for cfg in \
              "CONFIG_BPF_EVENTS" "CONFIG_PERF_EVENTS" \
              "CONFIG_KPROBES" "CONFIG_KPROBE_EVENTS" \
              "CONFIG_TRACING" "CONFIG_FTRACE" "CONFIG_GENERIC_TRACER" "CONFIG_KALLSYMS_ALL"; do
              sed -i "s/# ${cfg} is not set//g" "$KCONFIG"
              grep -qF "${cfg}=y" "$KCONFIG" || echo "${cfg}=y" >> "$KCONFIG"
            done

            # 6. 注入 XDP、Netkit、cgroup eBPF、套接字监控等底层支持
            for cfg in \
              "CONFIG_XDP_SOCKETS" \
              "CONFIG_IKCONFIG" "CONFIG_IKCONFIG_PROC" \
              "CONFIG_CGROUPS" "CONFIG_CGROUP_CPUACCT" "CONFIG_CGROUP_BPF" "CONFIG_SOCK_CGROUP_DATA" \
              "CONFIG_INET_DIAG" "CONFIG_INET_UDP_DIAG" "CONFIG_INET_DIAG_DESTROY" \
              "CONFIG_NETKIT" \
              "CONFIG_NET_ACT_BPF" "CONFIG_NET_CLS_BPF" "CONFIG_NET_CLS_ACT" \
              "CONFIG_NF_CONNTRACK_MARK" "CONFIG_NFT_TPROXY" "CONFIG_NFT_SOCKET" "CONFIG_NFT_FIB"; do
              sed -i "s/# ${cfg} is not set//g" "$KCONFIG"
              grep -qF "${cfg}=y" "$KCONFIG" || echo "${cfg}=y" >> "$KCONFIG"
            done
          done

      - name: 载入预设与纯净白名单双重拦截
        run: |
          if [ -d "files" ]; then
            cp -r files/ openwrt/files/
          fi
          if [ -f ".config" ]; then
            cp .config openwrt/.config
          fi
          cd openwrt
          
          # 抹除 bpf.mk 内部的 /invalid 回退路径
          sed -i 's|LLVM_PATH:=.*|LLVM_PATH:=/usr/bin|g' include/bpf.mk 2>/dev/null || true
          
          # 1. 首次 defconfig：展开基础依赖树
          make defconfig

          # 2. 严格执行白名单过滤
          PROTECT_LIST="luci-app-daede|luci-app-firewall|luci-app-package-manager|luci-app-opkg|luci-app-aurora-config|zoneinfo-asia"
          echo "=== 正在扫描并清理多余的非必要应用 ==="
          REMOVED_PLUGINS=()
          for pkg in $(grep "=y" .config | grep "^CONFIG_PACKAGE_luci-app-" | grep -v -E "$PROTECT_LIST" | cut -d'=' -f1); do
              REMOVED_PLUGINS+=("$pkg")
              sed -i "/${pkg}/d" .config
              echo "# ${pkg} is not set" >> .config
          done

          # 3. 强制剔除重型组件并彻底封杀 Bootstrap 主题
          for extra_pkg in "CONFIG_PACKAGE_ruby" "CONFIG_PACKAGE_openclash-core" "CONFIG_PACKAGE_luci-app-openclash" "CONFIG_PACKAGE_vmlinux-btf" "CONFIG_PACKAGE_adguardhome" "CONFIG_PACKAGE_luci-app-adguardhome" "CONFIG_PACKAGE_luci-theme-bootstrap"; do
              if grep -q "${extra_pkg}=y" .config; then
                  REMOVED_PLUGINS+=("$extra_pkg")
                  sed -i "/${extra_pkg}/d" .config
                  echo "# ${extra_pkg} is not set" >> .config
              fi
          done

          if [ ${#REMOVED_PLUGINS[@]} -gt 0 ]; then
              echo "🚨 以下多余第三方组件已被剔除："
              for item in "${REMOVED_PLUGINS[@]}"; do
                  echo "   - $item"
              done
          else
              echo "✨ 未发现多余第三方插件，配置保持纯净！"
          fi

          # 4. 写入开机脚本：固化默认主题为 Aurora
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-default-theme
#!/bin/sh
uci set luci.main.mediaurlbase='/luci-static/aurora'
uci commit luci
exit 0
EOF
          chmod +x files/etc/uci-defaults/99-default-theme

          # 5. 二次 defconfig：固化纯净配置
          make defconfig

          # 6. 打印确认保留的应用与主题
          echo "=== 最终确认：保留的 LuCI 应用与主题 ==="
          grep "=y" .config | grep -E "CONFIG_PACKAGE_luci-(app|theme|compat|lua)"

      - name: 预下载源码依赖
        run: |
          cd openwrt
          make download -j8

      - name: 全速冲刺多线程编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 提取固件并生成版本变量
        id: organize
        run: |
          cd openwrt/bin/targets/mediatek/filogic/
          FIRMWARE=$(ls *gl-mt3600be-squashfs-sysupgrade.bin | head -n 1)
          export TZ='Asia/Shanghai'
          
          TAG_NAME="v$(date +%Y.%m.%d-%H%M)"
          [ $(date +%H) -lt 12 ] && AP="上午" || AP="下午"
          RELEASE_NAME="GL-MT3600BE 满血 daede 固件 ($(date +%Y-%m-%d) ${AP})"
          FILE_NAME="daede-$(date +%Y%m%d)-${AP}$(date +%I%M).bin"
          mv "$FIRMWARE" "$FILE_NAME"
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "firmware_path=openwrt/bin/targets/mediatek/filogic/${FILE_NAME}" >> $GITHUB_OUTPUT
          echo "firmware_name=${FILE_NAME}" >> $GITHUB_OUTPUT

      - name: 上传固件至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.organize.outputs.firmware_name }}
          path: ${{ steps.organize.outputs.firmware_path }}
          retention-days: 3

      - name: 自动发布固件至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.organize.outputs.tag_name }}
          name: ${{ steps.organize.outputs.release_name }}
          body: |
            ### 固件配置说明
            * **核心内核**：集成 dae + daed 双完全体（支持 Netkit 虚拟网卡通道）[cite: 1]
            * **内核 BTF**：原生内置 `/sys/kernel/btf/vmlinux` 核心字典与 BPF 事件追踪
            * **视觉界面**：独占集成 Aurora 磨砂极简主题及配套中文设置面板，彻底剥除 Bootstrap
            * **底层调优**：开启 XDP 快车道、桌面低延迟抢占模型（Preemptible）、BBR + FQ 拥塞队列[cite: 1]
            * **纯净瘦身**：彻底剔除 AdGuardHome 与 OpenClash，体积维持在 ~46MB 黄金容量
            * **上游版本**：`kenzok8/openwrt-daede` commit: `${{ needs.check.outputs.upstream_commit }}`
          files: ${{ steps.organize.outputs.firmware_path }}

      - name: 同步记录最新 Commit 哈希到仓库
        run: |
          echo "${{ needs.check.outputs.upstream_commit }}" > daede.hash
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daede.hash
          git commit -m "chore: sync upstream daede commit ${{ needs.check.outputs.upstream_commit }}" || true
          git push || true
