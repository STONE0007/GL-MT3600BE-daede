name: Build GL-MT3600BE daede

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 清理 Runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google-chrome* dotnet* powershell openjdk*
          sudo apt-get autoremove --purge -y
          sudo apt-get clean

      - name: 安装 OpenWrt 与 eBPF 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz genisoimage msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev clang llvm bpfcc-tools libbpf-dev

      - name: 拉取源码与配置 Feeds
        run: |
          git clone --depth 1 https://github.com/KaguyaRing/openwrt-custom-gl-mt3600be.git openwrt
          cd openwrt
          
          # 彻底剔除旧版 daed_repo，注入全新独立包与 Aurora 主题
          sed -i '/daed_repo/d' feeds.conf.default 2>/dev/null || true
          git clone --depth 1 https://github.com/kenzok8/openwrt-daede.git package/openwrt-daede
          rm -rf package/luci-theme-aurora package/luci-app-aurora-config
          git clone -b v0.10.0 --depth 1 https://github.com/eamonxg/luci-theme-aurora.git package/luci-theme-aurora
          git clone --depth 1 https://github.com/eamonxg/luci-app-aurora-config.git package/luci-app-aurora-config
          
          # 卸载冲突包并更新安装 Feeds
          ./scripts/feeds uninstall luci-app-daede daed dae 2>/dev/null || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

          # 替换 Go 编译器为 1.26+ 分支
          rm -rf feeds/packages/lang/golang
          git clone --depth 1 https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang
          ./scripts/feeds install -f -p packages golang

      - name: 注入第六步满血 eBPF 与底层内核优化
        run: |
          cd openwrt
          KCONFIGS=$(ls target/linux/mediatek/filogic/config-* 2>/dev/null)
          for KCONFIG in $KCONFIGS; do
            # 1. 切换抢占模型为低延迟桌面级（Preemptible Kernel）
            sed -i 's/CONFIG_PREEMPT_NONE=y/# CONFIG_PREEMPT_NONE is not set/g' "$KCONFIG"
            sed -i 's/CONFIG_PREEMPT_VOLUNTARY=y/# CONFIG_PREEMPT_VOLUNTARY is not set/g' "$KCONFIG"
            grep -qF "CONFIG_PREEMPT=y" "$KCONFIG" || echo "CONFIG_PREEMPT=y" >> "$KCONFIG"
            grep -qF "CONFIG_PREEMPTION=y" "$KCONFIG" || echo "CONFIG_PREEMPTION=y" >> "$KCONFIG"

            # 2. 注入 XDP、Netkit、BBR+FQ、cgroup eBPF、套接字监控等内核底层支持
            for cfg in \
              "CONFIG_XDP_SOCKETS" \
              "CONFIG_TCP_CONG_BBR" "CONFIG_NET_SCH_FQ" \
              "CONFIG_IKCONFIG" "CONFIG_IKCONFIG_PROC" \
              "CONFIG_CGROUPS" "CONFIG_CGROUP_CPUACCT" "CONFIG_CGROUP_BPF" "CONFIG_SOCK_CGROUP_DATA" \
              "CONFIG_INET_DIAG" "CONFIG_INET_UDP_DIAG" "CONFIG_INET_DIAG_DESTROY" \
              "CONFIG_NETKIT" "CONFIG_DEBUG_INFO_BTF" \
              "CONFIG_NET_ACT_BPF" "CONFIG_NET_CLS_BPF" "CONFIG_NET_CLS_ACT" \
              "CONFIG_NF_CONNTRACK_MARK" "CONFIG_NFT_TPROXY" "CONFIG_NFT_SOCKET" "CONFIG_NFT_FIB"; do
              sed -i "s/# ${cfg} is not set//g" "$KCONFIG"
              grep -qF "${cfg}=y" "$KCONFIG" || echo "${cfg}=y" >> "$KCONFIG"
            done
          done

      - name: 载入预埋 Files 与核心配置
        run: |
          if [ -d "files" ]; then
            cp -r files/ openwrt/files/
          fi
          if [ -f ".config" ]; then
            cp .config openwrt/.config
          fi
          cd openwrt
          
          # 执行白名单过滤保护
          PROTECT_LIST="luci-app-daede|luci-app-firewall|luci-app-package-manager|luci-app-opkg|luci-app-aurora-config|zoneinfo-asia"
          for pkg in $(grep "=y" .config | grep "^CONFIG_PACKAGE_luci-app-" | grep -v -E "$PROTECT_LIST" | cut -d'=' -f1); do
              sed -i "/${pkg}/d" .config
              echo "# ${pkg} is not set" >> .config
          done
          sed -i '/CONFIG_PACKAGE_ruby/d' .config
          echo "# CONFIG_PACKAGE_ruby is not set" >> .config

          make defconfig

      - name: 预下载源码依赖
        run: |
          cd openwrt
          make download -j8

      - name: 全速冲刺多线程编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 提取固件并按 12 小时制重命名归档
        id: organize
        run: |
          cd openwrt/bin/targets/mediatek/filogic/
          FIRMWARE=$(ls *gl-mt3600be-squashfs-sysupgrade.bin | head -n 1)
          export TZ='Asia/Shanghai'
          [ $(date +%H) -lt 12 ] && AP="上午" || AP="下午"
          TIME_TAG="$(date +%Y%m%d)-${AP}$(date +%I%M)"
          NEW_NAME="daede-${TIME_TAG}.bin"
          mv "$FIRMWARE" "$NEW_NAME"
          echo "firmware_path=openwrt/bin/targets/mediatek/filogic/${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "firmware_name=${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: 上传固件至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.organize.outputs.firmware_name }}
          path: ${{ steps.organize.outputs.firmware_path }}
